/* ================= FIREBASE / FIRESTORE (shared cloud storage) =================
   Storage sekarang memakai Cloud Firestore, BUKAN localStorage lagi.
   Ini membuat data yang diisi lewat APK (web2apk / WebView) otomatis
   tersinkron ke web, dan sebaliknya, karena semua platform membaca &
   menulis ke database cloud yang sama. Membutuhkan koneksi internet.
   NB: SDK Firebase dimuat lewat dynamic import() (bukan <script type="module">)
   supaya semua fungsi di file ini tetap bisa dipanggil dari atribut
   onclick/onchange di HTML (yang butuh scope global, tidak tersedia di module). */
const firebaseConfig = {
  apiKey: "AIzaSyDDao-exdcKHLPd2X9vsvnr4wVpu7TsJUk",
  authDomain: "absensi-xyz.firebaseapp.com",
  projectId: "absensi-xyz",
  storageBucket: "absensi-xyz.firebasestorage.app",
  messagingSenderId: "784344977528",
  appId: "1:784344977528:web:1e2eea69b1237910cedd8d",
  measurementId: "G-SGXWMK766Y"
};
let db, fsDoc, fsGetDoc, fsSetDoc;
async function initFirebase(){
  const [{ initializeApp }, { getAnalytics }, { getFirestore, doc, getDoc, setDoc }, { getAuth, signInAnonymously }] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js"),
    import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"),
    import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js"),
  ]);
  const firebaseApp = initializeApp(firebaseConfig);
  try{ getAnalytics(firebaseApp); }catch(e){ /* analytics opsional, abaikan jika gagal (mis. diblokir adblock) */ }
  db = getFirestore(firebaseApp);
  fsDoc = doc; fsGetDoc = getDoc; fsSetDoc = setDoc;
  /* Anonymous sign-in: diperlukan supaya Firestore Security Rules bisa
     mensyaratkan "request.auth != null" (menolak akses tanpa lewat app ini),
     tanpa perlu form login Firebase terpisah untuk pengguna. */
  const auth = getAuth(firebaseApp);
  await signInAnonymously(auth);
}

/* Semua data disimpan sebagai satu dokumen per "key" di dalam
   collection "appdata", supaya perubahan pada fungsi get/save di bawah
   ini seminimal mungkin dibanding kode localStorage sebelumnya. */
async function fsGet(key){
  try{
    const snap = await fsGetDoc(fsDoc(db, "appdata", key));
    return snap.exists() ? snap.data().value : null;
  }catch(e){ console.error("Firestore get error:", key, e); return null; }
}
async function fsSet(key, value){
  try{
    await fsSetDoc(fsDoc(db, "appdata", key), { value, updatedAt: Date.now() });
    return true;
  }catch(e){ console.error("Firestore set error:", key, e); return false; }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString('id-ID',{weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
function fmtDateShort(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString('id-ID',{year:'numeric', month:'long', day:'numeric'});
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---- Helper tanggal otomatis (Hari / Tanggal / Bulan / Tahun) ---- */
function hariNama(d){ const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString('id-ID',{weekday:'long'}); }
function tanggalAngka(d){ const dt = new Date(d+"T00:00:00"); return dt.getDate(); }
function bulanNama(d){ const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString('id-ID',{month:'long'}); }
function tahunAngka(d){ const dt = new Date(d+"T00:00:00"); return dt.getFullYear(); }
function dmyOrBlank(dateStr){
  if(!dateStr) return `...... / ...... / ${new Date().getFullYear()}`;
  const dt = new Date(dateStr+"T00:00:00");
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  return `${dd} / ${mm} / ${dt.getFullYear()}`;
}
function hariTanggalDisplay(dateStr){
  if(!dateStr) return '';
  const dt = new Date(dateStr+"T00:00:00");
  return `${dt.toLocaleDateString('id-ID',{weekday:'long'})}, ${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}

/* ================= SEED DATA ================= */
function seedBagianList(){
  const names = [
    "Pok Pim","Bagdik","Bagjianbangdik","Bagum","Denma","Set & Pok Banpri",
    "Alins Alongins","Tim Gumil","Deppengmilum","Depkom","Depkonbekharstal",
    "Deppernika Fotfilmil","Depsiber","Satdik Pa","Satdik Ba/Ta","Jas","Ton Demlat"
  ];
  const bagdikPersonnel = [
    "Kukun Suhara","Maman Rohman","Maria Ulfa","Indra Maulana","Ani Suherni",
    "Agus Tri","Andi Euzebio Christovo","Weni Bler","Khalissazia","Novito Ramadhan","Lismawati"
  ];
  return names.map(nama=>{
    const id = nama.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    const personnel = nama === "Bagdik"
      ? bagdikPersonnel.map(n=>({id:uid(), nama:n}))
      : [{id:uid(), nama:"Nama Personel 1"},{id:uid(), nama:"Nama Personel 2"}];
    return { id, kode:id, nama, password: id.replace(/-/g,'')+"123", personnel };
  });
}

/* ================= STORAGE HELPERS =================
   Memakai Cloud Firestore (lihat fsGet/fsSet di atas) sebagai sumber data
   bersama. Web dan APK (web2apk / WebView) yang membuka URL yang sama akan
   membaca & menulis ke dokumen Firestore yang sama, sehingga data yang
   diisi di satu sisi akan muncul di sisi lainnya. */

async function getBagianList(){
  const v = await fsGet("app-bagian-list-v2");
  if(v) return v;
  const seeded = seedBagianList();
  await fsSet("app-bagian-list-v2", seeded);
  return seeded;
}
async function saveBagianList(list){ await fsSet("app-bagian-list-v2", list); }

async function getInstansi(){
  const v = await fsGet("app-instansi-v2");
  if(v) return v;
  const def = { line1: DEFAULT_INSTANSI_1, line2: DEFAULT_INSTANSI_2, kota:"Cimahi" };
  await fsSet("app-instansi-v2", def);
  return def;
}
async function saveInstansi(v){ await fsSet("app-instansi-v2", v); }

async function getAttendance(date, apel, bagianId){
  const v = await fsGet(`att2-${date}-${apel}-${bagianId}`);
  if(v) return v;
  return { records:{}, submitted:false, submittedAt:null, ket:"" };
}
async function saveAttendance(date, apel, bagianId, data){
  await fsSet(`att2-${date}-${apel}-${bagianId}`, data);
}
async function getPaJaga(){
  const v = await fsGet("app-pajaga");

  return { nama:"", pangkat:"", nrp:"", ttd:"" };

/* ---- Laporan Kegiatan & Serah Terima (per tanggal) ---- */
function emptySigner(){ return {nama:"", pangkat:"", nrp:"", ttd:""}; }
function newKegiatanRow(){ return {id:uid(), tanggal:"", pukul:"", uraian:"", ket:""}; }
function emptyKegiatan(dateStr){
  return {
    tmtStart: dateStr || "", tmtEnd: dateStr || "",
    rows: [newKegiatanRow(), newKegiatanRow(), newKegiatanRow()],
    paJagaBaru: emptySigner(), paJagaLama: emptySigner(), komandan: emptySigner()
  };
}
function newBarangRow(nama, angka, huruf){ return {id:uid(), nama:nama||"", angka:angka||"", huruf:huruf||"", ket:""}; }
function defaultBarang(){
  const items = [
    ["Pistol FN 46","1","Satu"],
    ["Munisi","10","Satu Nol"],
    ["Magazen","2","Dua"],
    ["Amply / Mic Duduk","1/1","Satu / Satu"],
    ["Faximile","1","Satu"],
    ["Komputer","1","Satu"],
    ["Meja / Kursi","3/2","Tiga / Dua"],
    ["Jam Dinding","1","Satu"],
    ["Tempat Tidur","2","Dua"],
    ["Ban Lengan Pa/Ba/Ta Jaga","1/1/1","Satu / Satu / Satu"],
  ];
  const rows = items.map(([nama,angka,huruf])=>newBarangRow(nama,angka,huruf));
  rows.push(newBarangRow()); rows.push(newBarangRow());
  return rows;
}
function emptySerahTerima(dateStr){
  return {
    sprinNo:"", sprinTanggal: dateStr || "", tmtStart: dateStr || "", tmtEnd: dateStr || "", keadaan:"Aman",
    paJagaLama: emptySigner(), paJagaBaru: emptySigner(),
    barang: defaultBarang()
  };
}
async function getKegiatan(date){
  const v = await fsGet(`kegiatan-${date}`);
  if(v){
    if(!v.komandan) v.komandan = emptySigner();
    return v;
  }
  return emptyKegiatan(date);
}
async function saveKegiatan(date, data){ await fsSet(`kegiatan-${date}`, data); }
async function getSerahTerimaData(date){
  const v = await fsGet(`serahterima-${date}`);
  if(v) return v;
  return emptySerahTerima(date);
}
async function saveSerahTerimaData(date, data){ await fsSet(`serahterima-${date}`, data); }

function showFatalError(err){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div style="max-width:640px;margin:60px auto;padding:28px;font-family:system-ui,sans-serif;background:#fff;border:1px solid #e5d9c3;border-left:5px solid #a5403a;border-radius:4px;">

      <p style="font-size:14px;color:#333;line-height:1.6;">Terjadi kesalahan teknis saat memuat aplikasi. Pesan error:</p>
      <pre style="background:#f6f4ee;padding:12px;border-radius:4px;font-size:12.5px;white-space:pre-wrap;color:#a5403a;">${(err && (err.stack || err.message || err)) || 'Tidak diketahui'}</pre>
      <p style="font-size:13px;color:#666;">Coba: (1) pastikan file dibuka di browser (Chrome/Edge/Firefox), bukan di aplikasi lain seperti WPS/Word; (2) tekan F12 lalu buka tab "Console" dan salin pesan error berwarna merah di sana; (3) coba buka file di browser lain.</p>
    </div>`;
}
window.addEventListener("error", (e)=>{ showFatalError(e.error || e.message); });

async function init(){
  try{
    await initFirebase();
    state.bagianList = await getBagianList();
    state.instansi = await getInstansi();
    state.paJaga = await getPaJaga();
    state.mengetahui = await getMengetahui();
    render();
  }catch(err){
    showFatalError(err);
  }
}
init();

  if(state.pollTimer && state.view !== "operator"){ clearInterval(state.pollTimer); state.pollTimer=null; }
  if(state.view === "video") return renderVideoIntro();
  if(state.view === "intro") return renderIntro();
  if(state.view === "login") return renderLogin();
  if(state.view === "bagian") return renderBagian();
  if(state.view === "operator") return renderOperator();
  if(state.view === "manage") return renderManage();
}

  const role = document.getElementById("login-role").value;
  const pass = document.getElementById("login-pass").value;
  state.bagianList = await getBagianList();
  if(role === "operator"){
    if(pass === OPERATOR_PASSWORD){
      state.currentUser = { type:"operator" };
      state.loginErr = ""; state.view = "operator"; render();

}

let bagianAttendance = { records:{}, submitted:false, submittedAt:null, ket:"" };

  const total = b.personnel.length;

        <div>

      </div>

      <div class="panel">
        ${b.personnel.map((p,i)=>{
          const r = bagianAttendance.records[p.id] || {status:"Hadir", note:""};

        </div>
        <div style="display:flex;gap:10px;">
          ${bagianAttendance.submitted
            ? `<button class="btn ghost" onclick="unlockReport()">Buka Kembali untuk Edit</button>`

function changeBagianDate(v){ state.bagianDate = v; renderBagian(); }
function changeBagianApel(v){ state.bagianApel = v; renderBagian(); }
async function setStatus(personnelId, status){
  bagianAttendance.records[personnelId] = bagianAttendance.records[personnelId] || {status:"Hadir", note:""};
  bagianAttendance.records[personnelId].status = status;
  await saveAttendance(state.bagianDate, state.bagianApel, state.currentUser.bagianId, bagianAttendance);
}
async function setNote(personnelId, note){
  bagianAttendance.records[personnelId] = bagianAttendance.records[personnelId] || {status:"Hadir", note:""};
  bagianAttendance.records[personnelId].note = note;
  await saveAttendance(state.bagianDate, state.bagianApel, state.currentUser.bagianId, bagianAttendance);
}
async function submitReport(){
  const b = bagianById(state.currentUser.bagianId);
  b.personnel.forEach(p=>{ if(!bagianAttendance.records[p.id]) bagianAttendance.records[p.id] = {status:"Hadir", note:""}; });
  bagianAttendance.submitted = true;
  bagianAttendance.submittedAt = new Date().toISOString();
  await saveAttendance(state.bagianDate, state.bagianApel, b.id, bagianAttendance);
  renderBagian();
}
async function unlockReport(){
  bagianAttendance.submitted = false; bagianAttendance.submittedAt = null;
  await saveAttendance(state.bagianDate, state.bagianApel, state.currentUser.bagianId, bagianAttendance);
  renderBagian();
}

/* ================= OPERATOR VIEW ================= */
let operatorData = {};
let kegiatanData = null;
let serahTerimaData = null;

function computeRow(b, att){
  const jml = b.personnel.length;
  const counts = {}; KURANG_CODES.forEach(c=>counts[c]=0);
  let hadir=0;
  b.personnel.forEach(p=>{
    const r = att.records[p.id];
    const status = r ? r.status : "Hadir";
    if(status === "Hadir") hadir++; else counts[status] = (counts[status]||0)+1;
  });
  const krg = jml - hadir;
  return { jml, krg, hdr:hadir, counts };
}

function operatorTabsRow(){
  return `
  <div class="apel-tabs">
    ${APEL_TYPES.map(a=>`<div class="apel-tab ${state.operatorView==='rekap'&&state.operatorApel===a.id?'active':''}" onclick="changeOperatorApel('${a.id}')">${a.label}</div>`).join("")}
    <div class="tab-sep"></div>
    <div class="apel-tab alt ${state.operatorView==='kegiatan'?'active':''}" onclick="switchOperatorView('kegiatan')">📝 Laporan Kegiatan</div>
    <div class="apel-tab alt ${state.operatorView==='serahterima'?'active':''}" onclick="switchOperatorView('serahterima')">🤝 Serah Terima</div>
  </div>`;
}

async function switchOperatorView(view){
  state.operatorView = view;
  if(view==='kegiatan' && !kegiatanData){ kegiatanData = await getKegiatan(state.operatorDate); }
  if(view==='serahterima' && !serahTerimaData){ serahTerimaData = await getSerahTerimaData(state.operatorDate); }
  renderOperator(true);
}

async function renderOperator(skipReload){
  if(!skipReload){
    state.bagianList = await getBagianList();
    if(state.operatorView === 'rekap'){
      operatorData = {};
      for(const b of state.bagianList){ operatorData[b.id] = await getAttendance(state.operatorDate, state.operatorApel, b.id); }
    } else if(state.operatorView === 'kegiatan'){
      kegiatanData = await getKegiatan(state.operatorDate);
    } else if(state.operatorView === 'serahterima'){
      serahTerimaData = await getSerahTerimaData(state.operatorDate);
    }
  }

  let headTitle, headSub, mainContentHtml;

  if(state.operatorView === 'rekap'){
    const totals = { jml:0, krg:0, hdr:0, counts:{} };
    KURANG_CODES.forEach(c=>totals.counts[c]=0);
    let sentCount=0;
    const rows = state.bagianList.map(b=>{
      const att = operatorData[b.id] || { records:{}, submitted:false, ket:"" };
      const row = computeRow(b, att);
      totals.jml += row.jml; totals.krg += row.krg; totals.hdr += row.hdr;
      KURANG_CODES.forEach(c=>totals.counts[c]+=row.counts[c]);
      if(att.submitted) sentCount++;
      return { b, att, row };
    });
    const selected = state.selectedBagianId ? rows.find(r=>r.b.id===state.selectedBagianId) : null;

    headTitle = `Laporan Kekuatan ${apelLabel(state.operatorApel)}`;
    headSub = `${fmtDate(state.operatorDate)} &nbsp;•&nbsp; <span class="live-dot"></span>diperbarui otomatis &nbsp;•&nbsp; ${sentCount}/${state.bagianList.length} bagian sudah lapor`;

    mainContentHtml = `
      <div class="chip-row">
        <div class="chip"><div class="num">${state.bagianList.length}</div><div class="lbl">Total Bagian</div></div>
        <div class="chip"><div class="num">${totals.jml}</div><div class="lbl">JML</div></div>
        <div class="chip hadir"><div class="num">${totals.hdr}</div><div class="lbl">HDR</div></div>
        <div class="chip tidak"><div class="num">${totals.krg}</div><div class="lbl">KRG</div></div>
      </div>

      <div class="op-layout">
        <div class="op-table-wrap">
          <table class="rekap">
            <thead>
              <tr>
                <th style="min-width:30px;">No</th>
                <th class="col-bagian">Bagian</th>
                <th>JML</th><th>KRG</th><th>HDR</th>
                ${KURANG_CODES.map(c=>`<th>${c}</th>`).join("")}
                <th style="min-width:90px;">KET</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r,i)=>`
                <tr class="${state.selectedBagianId===r.b.id?'selected':''}" onclick="selectBagian('${r.b.id}')">
                  <td>${i+1}</td>
                  <td class="col-bagian">${escapeHtml(r.b.nama)}
                    <span class="status-pill ${r.att.submitted?'sent':'pending'}">${r.att.submitted?'Terkirim':'Belum'}</span>
                  </td>
                  <td class="num-jml">${r.row.jml}</td>
                  <td class="num-krg ${r.row.krg===0?'zero':''}">${r.row.krg||'-'}</td>
                  <td class="num-hdr">${r.row.hdr}</td>
                  ${KURANG_CODES.map(c=>`<td class="${r.row.counts[c]===0?'zero':''}">${r.row.counts[c]||'-'}</td>`).join("")}
                  <td onclick="event.stopPropagation()"><input class="ket-input" value="${escapeHtml(r.att.ket||'')}" placeholder="—" onchange="setBagianKet('${r.b.id}', this.value)" /></td>
                </tr>
              `).join("")}
            </tbody>
            <tfoot>
              <tr>
                <td></td><td class="col-bagian">JUMLAH</td>
                <td>${totals.jml}</td><td>${totals.krg||'-'}</td><td>${totals.hdr}</td>
                ${KURANG_CODES.map(c=>`<td>${totals.counts[c]||'-'}</td>`).join("")}
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>

        <div class="side-panel">
          ${selected ? `
            <div class="side-panel-head">
              <h3>${escapeHtml(selected.b.nama)}</h3>
              <div class="sp-sub">${fmtDateShort(state.operatorDate)} • ${apelLabel(state.operatorApel)} • ${selected.row.hdr}/${selected.row.jml} hadir</div>
            </div>
            <div class="side-panel-body">
              ${renderSidePanelDetail(selected.b, selected.att)}
            </div>
          ` : `<div class="side-empty">Klik salah satu baris bagian pada tabel untuk melihat rincian nama personel per keterangan.</div>`}
        </div>
      </div>
    `;
  } else if(state.operatorView === 'kegiatan'){
    headTitle = "Laporan Kegiatan";
    headSub = fmtDate(state.operatorDate);
    mainContentHtml = kegiatanScreenHtml();
  } else {
    headTitle = "Serah Terima";
    headSub = fmtDate(state.operatorDate);
    mainContentHtml = serahTerimaScreenHtml();
  }

  app.innerHTML = `
    ${topBar(`<button class="btn on-navy" onclick="goManage()">Kelola Bagian</button>`)}
    <main>
      <div class="page-head">
        <div>
          <div class="eyebrow">Panel Operator</div>
          <h2>${headTitle}</h2>
          <div class="sub">${headSub}</div>
        </div>
        <div class="head-actions">
          <div class="datepick"><span>📅</span><input type="date" id="op-date" value="${state.operatorDate}" onchange="changeOperatorDate(this.value)" /></div>
          <button class="btn gold" onclick="handlePrintClick()">🖨 Cetak Laporan</button>
        </div>
      </div>

      ${operatorTabsRow()}

      ${mainContentHtml}
    </main>
    <footer class="foot">${state.operatorView==='rekap' ? 'Tabel memuat ulang otomatis setiap beberapa detik untuk menampilkan status terbaru.' : 'Data tersimpan otomatis saat Anda mengisi kolom di atas.'}</footer>
  `;

  if(!state.pollTimer){
    state.pollTimer = setInterval(async ()=>{
      if(state.view !== "operator") return;
      if(state.operatorView !== "rekap") return; // jangan ganggu pengisian form kegiatan/serah terima
      for(const b of state.bagianList){ operatorData[b.id] = await getAttendance(state.operatorDate, state.operatorApel, b.id); }
      renderOperator(true);
    }, 5000);
  }
}
function renderSidePanelDetail(b, att){
  const groups = {}; STATUS_OPTIONS.forEach(s=>groups[s]=[]);
  b.personnel.forEach(p=>{
    const r = att.records[p.id];
    const status = r ? r.status : "Hadir";
    groups[status].push({ nama:p.nama, note: r ? r.note : "" });
  });
  let html = "";
  KURANG_CODES.forEach(code=>{
    const list = groups[code];
    if(list.length===0) return;
    html += `
      <div class="sp-cat">
        <div class="sp-cat-head" style="color:${CODE_COLOR[code]}"><span>${code}</span><span class="sp-cat-count" style="background:${CODE_COLOR[code]}">${list.length}</span></div>
        <ul class="sp-name-list">
          ${list.map(x=>`<li style="border-left-color:${CODE_COLOR[code]}">${escapeHtml(x.nama)}${x.note?`<span class="nm-note">${escapeHtml(x.note)}</span>`:''}</li>`).join("")}
        </ul>
      </div>`;
  });
  if(!html) html = `<div class="side-empty" style="padding:10px 0;">Tidak ada personel dengan keterangan kurang — seluruh personel hadir.</div>`;
  const hadirList = groups["Hadir"];
  html += `
    <div class="sp-cat">
      <div class="sp-cat-head" style="color:${CODE_COLOR['Hadir']}"><span>HADIR</span><span class="sp-cat-count" style="background:${CODE_COLOR['Hadir']}">${hadirList.length}</span></div>
      <ul class="sp-name-list">
        ${hadirList.map(x=>`<li style="border-left-color:${CODE_COLOR['Hadir']}">${escapeHtml(x.nama)}</li>`).join("")}
      </ul>
    </div>`;
  return html;
}
function changeOperatorApel(v){ state.operatorApel = v; state.operatorView = 'rekap'; renderOperator(); }
async function changeOperatorDate(v){
  state.operatorDate = v;
  if(state.operatorView === 'kegiatan'){ kegiatanData = await getKegiatan(v); }
  else if(state.operatorView === 'serahterima'){ serahTerimaData = await getSerahTerimaData(v); }
  renderOperator();
}
function selectBagian(id){ state.selectedBagianId = (state.selectedBagianId===id)?null:id; renderOperator(true); }
async function setBagianKet(bagianId, val){
  operatorData[bagianId].ket = val;
  await saveAttendance(state.operatorDate, state.operatorApel, bagianId, operatorData[bagianId]);
}

/* ---- Kartu penandatangan (dipakai di layar Laporan Kegiatan & Serah Terima) ---- */
function signerCardEditHtml(screenType, role, label, s){
  s = s || emptySigner();
  const uidBase = `${screenType}-${role}`;
  return `
    <div class="signer-card">
      <div class="signer-card-head">${escapeHtml(label)}</div>
      <div class="field"><label>Nama</label><input value="${escapeHtml(s.nama)}" placeholder="Nama lengkap" onchange="setSignerField('${screenType}','${role}','nama', this.value)" /></div>
      <div class="field"><label>Pangkat</label><input value="${escapeHtml(s.pangkat)}" placeholder="Contoh: Kapten Cba" onchange="setSignerField('${screenType}','${role}','pangkat', this.value)" /></div>
      <div class="field"><label>NRP</label><input value="${escapeHtml(s.nrp)}" placeholder="Nomor Registrasi Pokok" onchange="setSignerField('${screenType}','${role}','nrp', this.value)" /></div>
      <div class="field" style="margin-bottom:0;">
        <label>Tanda Tangan Elektronik</label>
        <div class="ttd-upload-row">
          <input type="file" accept="image/*" id="file-${uidBase}" onchange="uploadSignerTtd('${screenType}','${role}', this)" />
          ${s.ttd ? `<div class="ttd-preview"><img src="${s.ttd}" alt="TTD" /><button type="button" class="btn ghost small" onclick="removeSignerTtd('${screenType}','${role}')">Hapus</button></div>` : ''}
        </div>
      </div>
    </div>`;
}
async function setSignerField(screenType, role, key, val){
  const data = screenType==='kegiatan' ? kegiatanData : serahTerimaData;
  data[role][key] = val;
  if(screenType==='kegiatan') await saveKegiatan(state.operatorDate, data);
  else await saveSerahTerimaData(state.operatorDate, data);
}
function uploadSignerTtd(screenType, role, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const data = screenType==='kegiatan' ? kegiatanData : serahTerimaData;
    data[role].ttd = e.target.result;
    if(screenType==='kegiatan') await saveKegiatan(state.operatorDate, data);
    else await saveSerahTerimaData(state.operatorDate, data);
    renderOperator(true);
  };

let modalSig = {};
function openPrintDialog(){
  const p = state.paJaga || {nama:"",pangkat:"",nrp:"",ttd:""};
  modalSig = { ttd: p.ttd || "" };
  openModal(`
    <h3>Data Penandatangan Laporan</h3>
    <div class="field"><label>Nama Pa Jaga</label><input id="pd-nama" value="${escapeHtml(p.nama)}" /></div>

  reader.readAsDataURL(file);
}

        <div class="field" style="flex:1;min-width:220px;margin-bottom:0;">
          <label>Baris 1 Kop Laporan</label>
          <input id="instansi1" value="${escapeHtml(state.instansi.line1)}" onchange="updateInstansi()" />
        </div>
        <div class="field" style="flex:1;min-width:220px;margin-bottom:0;">
          <label>Baris 2 Kop Laporan</label>
          <input id="instansi2" value="${escapeHtml(state.instansi.line2)}" onchange="updateInstansi()" />
        </div>
        <div class="field" style="width:160px;margin-bottom:0;">
          <label>Kota (tanda tangan)</label>
          <input id="instansiKota" value="${escapeHtml(state.instansi.kota)}" onchange="updateInstansi()" />
        </div>
      </div>

      <div class="panel" style="padding:20px;margin-bottom:24px;">
        <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Pejabat "Mengetahui" — dipakai otomatis di cetak Laporan Kegiatan &amp; Serah Terima</label>
        <div class="field"><label>Susunan Jabatan (satu baris = satu jabatan)</label><textarea id="mengetahui-chain" rows="5" onchange="updateMengetahui()">${escapeHtml(m.jabatanChain)}</textarea></div>
        <div class="field-row-2">
          <div class="field"><label>Nama</label><input id="mengetahui-nama" value="${escapeHtml(m.nama)}" onchange="updateMengetahui()" /></div>
          <div class="field"><label>Pangkat</label><input id="mengetahui-pangkat" value="${escapeHtml(m.pangkat)}" onchange="updateMengetahui()" /></div>
          <div class="field"><label>NRP</label><input id="mengetahui-nrp" value="${escapeHtml(m.nrp)}" onchange="updateMengetahui()" /></div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Tanda Tangan Elektronik</label>
          <div class="ttd-upload-row">
            <input type="file" accept="image/*" onchange="uploadMengetahuiTtd(this)" />
            ${m.ttd ? `<div class="ttd-preview"><img src="${m.ttd}" alt="TTD" /><button type="button" class="btn ghost small" onclick="removeMengetahuiTtd()">Hapus</button></div>` : ''}
          </div>
        </div>
      </div>

      <div class="manage-grid">
        <div class="bagian-list-side">
          ${state.bagianList.map(b=>`<div class="item ${b.id===state.manageActiveId?'active':''}" onclick="selectManage('${b.id}')">${escapeHtml(b.nama)} <span style="opacity:.6;">(${b.personnel.length})</span></div>`).join("")}
          <div style="padding:12px 14px;"><button class="btn gold small" style="width:100%;" onclick="addBagian()">+ Tambah Bagian</button></div>
        </div>
        <div>${active ? renderManageDetail(active) : `<div class="empty-note">Belum ada bagian. Tambahkan bagian baru.</div>`}</div>
      </div>
    </main>
  `;
}
function renderManageDetail(b){
  return `
    <div class="panel" style="padding:20px;">
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;">
        <div class="field" style="flex:1;min-width:180px;margin-bottom:0;"><label>Nama Bagian</label><input value="${escapeHtml(b.nama)}" onchange="renameBagian('${b.id}', this.value)" /></div>
        <div class="field" style="flex:1;min-width:180px;margin-bottom:0;"><label>Kata Sandi Login</label><input value="${escapeHtml(b.password)}" onchange="rePassBagian('${b.id}', this.value)" /></div>
      </div>
      <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Daftar Personel (${b.personnel.length})</label>
      ${b.personnel.map((p,i)=>`
        <div class="personnel-edit-row">
          <span style="width:22px;color:#999;font-size:12.5px;">${i+1}.</span>
          <input value="${escapeHtml(p.nama)}" onchange="renamePersonnel('${b.id}','${p.id}', this.value)" />
          <button class="btn ghost small" onclick="removePersonnel('${b.id}','${p.id}')">Hapus</button>
        </div>`).join("")}
      <button class="btn ghost small" onclick="addPersonnel('${b.id}')">+ Tambah Personel</button>
      <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:16px;">
        <button class="btn danger small" onclick="deleteBagian('${b.id}')">Hapus Bagian Ini</button>
      </div>
    </div>`;
}
function goBackToOperator(){ state.view = "operator"; render(); }
function selectManage(id){ state.manageActiveId = id; renderManage(); }
async function updateInstansi(){
  state.instansi = {
    line1: document.getElementById("instansi1").value,
    line2: document.getElementById("instansi2").value,
    kota: document.getElementById("instansiKota").value,
  };
  await saveInstansi(state.instansi);
}
async function updateMengetahui(){
  state.mengetahui = {
    jabatanChain: document.getElementById('mengetahui-chain').value,
    nama: document.getElementById('mengetahui-nama').value,
    pangkat: document.getElementById('mengetahui-pangkat').value,
    nrp: document.getElementById('mengetahui-nrp').value,
    ttd: state.mengetahui.ttd || ""
  };
  await saveMengetahui(state.mengetahui);
}
function uploadMengetahuiTtd(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    state.mengetahui.ttd = e.target.result;
    await saveMengetahui(state.mengetahui);
    renderManage();
  };
  reader.readAsDataURL(file);
}
async function removeMengetahuiTtd(){
  state.mengetahui.ttd = "";
  await saveMengetahui(state.mengetahui);
  renderManage();
}
async function addBagian(){
  const nama = prompt("Nama bagian baru:"); if(!nama) return;
  const idBase = nama.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
  let finalId = idBase, i=2;
  while(bagianById(finalId)){ finalId = idBase+"-"+i; i++; }
  state.bagianList.push({ id:finalId, kode:finalId, nama, password: finalId.replace(/-/g,'')+"123", personnel:[] });
  await saveBagianList(state.bagianList);
  state.manageActiveId = finalId; renderManage();
}
async function renameBagian(id, val){ bagianById(id).nama = val; await saveBagianList(state.bagianList); renderManage(); }
async function rePassBagian(id, val){ bagianById(id).password = val; await saveBagianList(state.bagianList); renderManage(); }
async function addPersonnel(bagianId){
  const nama = prompt("Nama personel baru:"); if(!nama) return;
  bagianById(bagianId).personnel.push({id:uid(), nama});
  await saveBagianList(state.bagianList); renderManage();
}
async function renamePersonnel(bagianId, personnelId, val){
  bagianById(bagianId).personnel.find(x=>x.id===personnelId).nama = val;
  await saveBagianList(state.bagianList);
}
async function removePersonnel(bagianId, personnelId){
  const b = bagianById(bagianId); b.personnel = b.personnel.filter(x=>x.id!==personnelId);
  await saveBagianList(state.bagianList); renderManage();
}
async function deleteBagian(id){
  if(!confirm("Hapus bagian ini beserta seluruh datanya?")) return;
  state.bagianList = state.bagianList.filter(b=>b.id!==id);
  await saveBagianList(state.bagianList);
  state.manageActiveId = state.bagianList[0] ? state.bagianList[0].id : null;
  renderManage();
}
</script>
</body>
</html>
